exclude =
    */debug/incremental
# Keep empty archives visible as inspection errors rather than hiding them.

# present: expect instrumentation evidence; absent: expect no evidence;
# ignore: no expectation. Unlisted checks default to ignore.
# Expectations follow the project's C/C++ flags and apply to every scanned file.
# Small objects, Rust dependencies, and helper programs can differ: failures
# identify missing or inconclusive evidence, not proof that flags were omitted.
[checks]
stack_protector = present
fortify = absent
asan = present
ubsan = present
tsan = absent
msan = absent
sancov = present
sancov_cmp = present
sancov_pc_table = present
llvm_profile = present
source_coverage = present
# The driver belongs in the fuzzer executable, not every object/helper/library.
# Use a config selecting only the fuzzer executable to expect this present.
libfuzzer = ignore

# Stack protection, UBSan, and glibc Fortify are not enabled for Rust here. Keep
# ASan and the coverage expectations so missing instrumentation remains visible.
# Native C objects bundled into .a files retain the baseline expectations.
[checks:*.rlib]
stack_protector = ignore
ubsan = ignore
fortify = ignore

[checks:*.rcgu.o]
stack_protector = ignore
ubsan = ignore
fortify = ignore

[checks:*.a(*.rcgu.o)]
stack_protector = ignore
ubsan = ignore
fortify = ignore

[checks:*libentryuuid*.so*]
stack_protector = ignore
ubsan = ignore
fortify = ignore

[checks:*libpwdchan*.so*]
stack_protector = ignore
ubsan = ignore
fortify = ignore

[output]
report = ../logs/symbolReport.md

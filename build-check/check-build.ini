# Paths are relative to THIS config, not the shell's working directory.
# List one literal path per line. Directory scans are recursive.
# Project variants with built server binaries. Incomplete variants are omitted.
[scan]
object_dirs =
    ../build/build_1
    ../build/build_2
    ../build/build_3
    ../build/build_4
    ../build/build_9
    ../build/build_10
    ../build/build_11
    ../build/build_12
    ../build/build_18
    ../build/build_19
binary_paths =
    ../build/build_1/.libs
    ../run/run_1/bin
    ../run/run_1/sbin
    ../run/run_1/lib
    ../build/build_2/.libs
    ../run/run_2/bin
    ../run/run_2/sbin
    ../run/run_2/lib
    ../build/build_3/.libs
    ../run/run_3/bin
    ../run/run_3/sbin
    ../run/run_3/lib
    ../build/build_4/.libs
    ../run/run_4/bin
    ../run/run_4/sbin
    ../run/run_4/lib
    ../build/build_9/.libs
    ../run/run_9/bin
    ../run/run_9/sbin
    ../run/run_9/lib
    ../build/build_10/.libs
    ../run/run_10/bin
    ../run/run_10/sbin
    ../run/run_10/lib
    ../build/build_11/.libs
    ../run/run_11/bin
    ../run/run_11/sbin
    ../run/run_11/lib
    ../build/build_12/.libs
    ../run/run_12/bin
    ../run/run_12/sbin
    ../run/run_12/lib
    ../build/build_18/.libs
    ../run/run_18/bin
    ../run/run_18/sbin
    ../run/run_18/lib
    ../build/build_19/.libs
    ../run/run_19/bin
    ../run/run_19/sbin
    ../run/run_19/lib
exclude =
    */debug/incremental
# Keep empty archives visible as inspection errors rather than hiding them.

# present: expect instrumentation evidence; absent: expect no evidence;
# ignore: no expectation. Unlisted checks default to ignore.
# Expectations follow the project's C/C++ flags and apply to every scanned file.
# Small objects, Rust dependencies, and helper programs can differ: failures
# identify missing or inconclusive evidence, not proof that flags were omitted.
[checks]
stack_protector = present
fortify = absent
asan = present
ubsan = present
tsan = absent
msan = absent
sancov = present
sancov_cmp = present
sancov_pc_table = present
llvm_profile = present
source_coverage = present
# The driver belongs in the fuzzer executable, not every object/helper/library.
# Use a config selecting only the fuzzer executable to expect this present.
libfuzzer = ignore

# UBSan and glibc Fortify are not generic Rust compiler requirements. Keep the
# other expectations on Rust code so missing sanitizer/coverage evidence is visible.
# Native C objects bundled into .a files retain the baseline expectations.
[checks:*.rlib]
ubsan = ignore
fortify = ignore

[checks:*.rcgu.o]
ubsan = ignore
fortify = ignore

[checks:*.a(*.rcgu.o)]
ubsan = ignore
fortify = ignore

[output]
report = ../logs/symbolReport.md
